name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Python 3.8 block-buffers stderr when it is not a terminal, so the log lagged far behind the test run.
  PYTHONUNBUFFERED: "1"

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.8", "3.10", "3.11", "3.12", "3.13", "3.14"]
        exclude:
          # actions/setup-python has no 3.8 build for current Ubuntu runners;
          # test-py38-linux below covers it in the official python:3.8 image.
          - os: ubuntu-latest
            python: "3.8"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Test suite from the source tree
        run: python -W ignore -m unittest discover -s tests -v
      - name: Install offline (in-tree build backend, no setuptools, no index)
        run: python -m pip install --no-index .
      - name: Installed command works
        run: |
          keto --version
          keto list
      - name: Test suite against the installed package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/installed"
          cp -r tests "$RUNNER_TEMP/installed/"
          cd "$RUNNER_TEMP/installed"
          python -W ignore -m unittest discover -s tests

  test-py38-linux:
    name: ubuntu-latest / Python 3.8 (container)
    runs-on: ubuntu-latest
    container: python:3.8-slim
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Test suite from the source tree
        run: python -W ignore -m unittest discover -s tests -v
      - name: Install offline (in-tree build backend, no setuptools, no index)
        run: python -m pip install --no-index .
      - name: Installed command works
        run: |
          keto --version
          keto list
      - name: Test suite against the installed package
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/installed"
          cp -r tests "$RUNNER_TEMP/installed/"
          cd "$RUNNER_TEMP/installed"
          python -W ignore -m unittest discover -s tests
